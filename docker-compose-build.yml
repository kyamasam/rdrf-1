version: "2"
services:
  base:
    build:
      context: ./
      dockerfile: Dockerfile-base
      args:
        http_proxy:
    image: rdrf-base

  builder:
    platform: linux/amd64
    build:
      context: ./
      dockerfile: Dockerfile-builder
    image: rdrf-builder
    command: releasetarball
    network_mode: host
    environment:
      BUILD_VERSION:
      GIT_BRANCH:
      PIP_INDEX_URL:
      PIP_TRUSTED_HOST:
      NO_PROXY:
    volumes:
      - ./build:/data
    depends_on:
      - base

  node:
    build:
      context: ./
      dockerfile: Dockerfile-node
    image: rdrf-node
    working_dir: /data/app/rdrf/rdrf/frontend
    command: build
    environment:
      YARN_CACHE_FOLDER: /opt/yarn_cache
    volumes:
      - ./build:/data
      - ./yarn_cache:/opt/yarn_cache

  dev:
    build:
      context: ./
      dockerfile: Dockerfile-dev
      args:
        ARG_PIP_INDEX_URL: ${PIP_INDEX_URL}
        ARG_PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST}
        http_proxy:
    image: rdrf-dev
    volumes:
      - .:/app
    depends_on:
      - base

  prod:
    build:
      context: ./
      dockerfile: Dockerfile-prod
      args:
        ARG_BUILD_VERSION: ${BUILD_VERSION}
    image: rdrf:${BUILD_VERSION}
    depends_on:
      - base

  lint:
    image: alpine/flake8
    working_dir: /apps
    volumes:
      - ./:/apps
